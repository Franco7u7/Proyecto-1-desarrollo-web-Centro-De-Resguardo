<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Refugio de Perros</title>
</head>
<body>

    <section id="vista-inicio">
        <h1>Refugio de Perros</h1>
        <p>Tu ayuda cambia la vida de muchos perritos.</p>
        <a href="#vista-usuario"><button type="button">Quiero ser voluntaria</button></a>
    </section>

    <hr>

    <section id="vista-usuario">
        <h2>Mi Perfil</h2>
        <p>Cuéntanos sobre ti y luego agenda tu cita como voluntaria.</p>

        <form id="form-datos-generales">
            <div>
                <label for="user-nombre-completo">Nombre Completo:</label>
                <input type="text" id="user-nombre-completo" name="user-nombre-completo" required>
            </div>

            <div>
                <label for="user-telefono">Teléfono de Contacto:</label>
                <input type="tel" id="user-telefono" name="user-telefono" required>
            </div>

            <div>
                <label for="user-dui">DUI:</label>
                <input type="text" id="user-dui" name="user-dui" placeholder="00000000-0" pattern="[0-9]{8}-[0-9]" maxlength="10" required>
            </div>

            <div>
                <label for="user-experiencia-previa">Experiencia previa con perros:</label>
                <textarea id="user-experiencia-previa" name="user-experiencia-previa" rows="3"></textarea>
            </div>

            <button type="submit">Agendar en Google Calendar</button>
        </form>

        <p><a href="#vista-inicio">Volver al inicio</a></p>
    </section>

    <script>
        // Si tienes un enlace de agenda de Google Calendar, ponlo aquí:
        // const CALENDAR_URL = "https://calendar.app.google/XXXXXXXX";
        const CALENDAR_URL = null;

        document.getElementById("form-datos-generales").addEventListener("submit", function (e) {
            e.preventDefault();

            let url = CALENDAR_URL;
            if (!url) {
                const detalles =
                    "Nombre: " + document.getElementById("user-nombre-completo").value +
                    "\nTeléfono: " + document.getElementById("user-telefono").value +
                    "\nDUI: " + document.getElementById("user-dui").value +
                    "\nExperiencia: " + document.getElementById("user-experiencia-previa").value;

                url = "https://calendar.google.com/calendar/render?action=TEMPLATE" +
                      "&text=" + encodeURIComponent("Voluntariado - Refugio de Perros") +
                      "&details=" + encodeURIComponent(detalles);
            }
            window.open(url, "_blank");
        });
    </script>

</body>
</html>
